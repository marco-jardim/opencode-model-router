name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  e2e:
    name: e2e (node 22, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Owner decision (phase 3.1): the Windows leg is non-blocking until its flakes are
    # fixed; see "Known follow-ups (non-blocking CI)" in docs/qa/verification-resource-budget/phase-3.1.md.
    # The Ubuntu leg stays blocking.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: test/fixtures/projects/pytest-app/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/omr-e2e-npm-cache
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('test/fixtures/projects/*/package-lock.json') }}
      # Windows only: the full default suite with coverage, so the merged report
      # sees the win32 branches the unit tests exercise (the `coverage` job
      # provides the POSIX side).
      # --coverage.reportOnFailure: vitest skips the report when a test fails (default
      # false), and the Windows leg must still hand its coverage JSON to the merge job.
      - name: Windows unit coverage
        id: win-unit
        if: matrix.os == 'windows-latest'
        run: npx vitest run --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/win-unit
        env:
          OMR_COVERAGE_ARTIFACT: "1"
      - name: e2e
        # Also runs after a failed Windows unit coverage step, so win-e2e coverage is still produced.
        if: ${{ always() && (success() || (matrix.os == 'windows-latest' && steps.win-unit.outcome == 'failure')) }}
        run: npx vitest run --maxWorkers=1 ${{ matrix.os == 'windows-latest' && '--coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/win-e2e' || '' }} test/integration/e2e test/integration/verify-resource-budget
        env:
          RUN_VERIFY_E2E: "1"
          OMR_E2E_NPM_CACHE: ${{ runner.temp }}/omr-e2e-npm-cache
          OMR_COVERAGE_ARTIFACT: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'windows-latest'
        with:
          name: coverage-windows
          path: coverage/*/coverage-final.json
          # A failed step may leave only one of win-unit / win-e2e.
          if-no-files-found: warn
          retention-days: 7

  # opencode loads the plugin under Bun; every other job runs under Node. This runs the real
  # verification primitives (exec, runner, slot, reference) under Bun as a plain script.
  bun-smoke:
    name: bun smoke (bun 1.3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun test/smoke/bun-runtime.smoke.ts

  coverage:
    name: coverage (node 22, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: test/fixtures/projects/pytest-app/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/omr-e2e-npm-cache
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('test/fixtures/projects/*/package-lock.json') }}
      - name: Linux unit coverage
        run: npx vitest run --coverage --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/linux-unit
        env:
          OMR_COVERAGE_ARTIFACT: "1"
      - name: Linux e2e coverage
        run: npx vitest run --maxWorkers=1 --coverage --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/linux-e2e test/integration/e2e test/integration/verify-resource-budget
        env:
          RUN_VERIFY_E2E: "1"
          OMR_E2E_NPM_CACHE: ${{ runner.temp }}/omr-e2e-npm-cache
          OMR_COVERAGE_ARTIFACT: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage/*/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-merge:
    name: coverage gate (merged Windows + Linux)
    needs: [coverage, e2e]
    # Runs even when the non-blocking Windows e2e leg failed; the Linux coverage job must pass.
    if: ${{ always() && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge and enforce the per-file gate
        shell: bash
        run: |
          shopt -s nullglob
          inputs=(coverage-artifacts/coverage-*/*/coverage-final.json)
          printf '%s\n' "${inputs[@]}"
          for f in coverage-artifacts/coverage-linux/linux-unit/coverage-final.json coverage-artifacts/coverage-linux/linux-e2e/coverage-final.json; do
            if [ ! -f "$f" ]; then echo "::error::required Linux coverage input missing: $f"; exit 1; fi
          done
          if [ "${#inputs[@]}" -lt 2 ] || [ "${#inputs[@]}" -gt 4 ]; then echo "::error::expected 2-4 coverage inputs, got ${#inputs[@]}"; exit 1; fi
          # The gate always blocks for the platform-neutral files. Windows e2e is non-blocking
          # (phase 3.1 follow-ups), so a Windows input may be missing. Linux-only coverage misses
          # the win32 branches of src/verify/exec.ts (65% lines / 58% branches on run 36364312868),
          # so only exec.ts turns warn-only, and only when the win-unit input (whose unit tests
          # cover those branches) is missing.
          soft=()
          if [ ! -f coverage-artifacts/coverage-windows/win-unit/coverage-final.json ]; then
            echo "::warning::Windows unit coverage input missing; src/verify/exec.ts is warn-only for this run, the other gated files still block"
            soft=(--warn-only src/verify/exec.ts)
          elif [ "${#inputs[@]}" -lt 4 ]; then
            echo "::warning::Windows e2e coverage input missing; the gate still blocks for every file"
          fi
          node scripts/coverage-merge.mjs "${soft[@]}" coverage/merged "${inputs[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: merged-coverage
          path: coverage/merged/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
