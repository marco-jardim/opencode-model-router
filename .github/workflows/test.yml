name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  windows:
    name: test + coverage (node 22, windows-latest)
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      # Report even after test failures so the gate can merge Windows branch coverage.
      # The test step still fails the job when a test fails.
      - name: Windows unit coverage
        run: npx vitest run --coverage --coverage.reportOnFailure --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/win-unit
        env:
          OMR_COVERAGE_ARTIFACT: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-windows
          path: coverage/*/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e (node 22, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: test/fixtures/projects/pytest-app/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/omr-e2e-npm-cache
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('test/fixtures/projects/*/package-lock.json') }}
      - name: e2e
        run: npx vitest run --maxWorkers=1 test/integration/e2e test/integration/verify-resource-budget
        env:
          RUN_VERIFY_E2E: "1"
          OMR_E2E_NPM_CACHE: ${{ runner.temp }}/omr-e2e-npm-cache
          OMR_COVERAGE_ARTIFACT: "1"

  # opencode loads the plugin under Bun; every other job runs under Node. This runs the real
  # verification primitives (exec, runner, slot, reference) under Bun as a plain script.
  bun-smoke:
    name: bun smoke (bun 1.3.14, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun test/smoke/bun-runtime.smoke.ts

  coverage:
    name: coverage (node 22, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: test/fixtures/projects/pytest-app/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/omr-e2e-npm-cache
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('test/fixtures/projects/*/package-lock.json') }}
      - name: Linux unit coverage
        run: npx vitest run --coverage --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/linux-unit
        env:
          OMR_COVERAGE_ARTIFACT: "1"
      - name: Linux e2e coverage
        run: npx vitest run --maxWorkers=1 --coverage --coverage.reporter=json --coverage.reporter=text-summary --coverage.reportsDirectory=coverage/linux-e2e test/integration/e2e test/integration/verify-resource-budget
        env:
          RUN_VERIFY_E2E: "1"
          OMR_E2E_NPM_CACHE: ${{ runner.temp }}/omr-e2e-npm-cache
          OMR_COVERAGE_ARTIFACT: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage/*/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-merge:
    name: coverage gate (Linux; merged with Windows outside PRs)
    needs: [coverage, windows]
    # PRs skip Windows; Linux coverage must pass, and a cancelled Windows job stops the merge.
    if: ${{ always() && needs.coverage.result == 'success' && needs.windows.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge and enforce the per-file gate
        shell: bash
        run: |
          inputs=(coverage-artifacts/coverage-linux/linux-unit/coverage-final.json coverage-artifacts/coverage-linux/linux-e2e/coverage-final.json)
          for f in "${inputs[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::required Linux coverage input missing: $f"; exit 1; fi
          done
          # Windows runs only on master pushes and manual runs, not on pull requests.
          # Without its input, only the Windows-dependent exec/executor gates are warn-only.
          soft=()
          if [ ! -f coverage-artifacts/coverage-windows/win-unit/coverage-final.json ]; then
            echo "::warning::Windows unit coverage input missing; on pull requests the Windows job does not run. Windows-only executor/exec coverage is checked on master pushes; src/verify/exec.ts and src/executor/ are warn-only for this run, all other gates still block"
            soft=(--warn-only src/verify/exec.ts --warn-only-prefix src/executor/)
          else
            inputs+=(coverage-artifacts/coverage-windows/win-unit/coverage-final.json)
          fi
          printf '%s\n' "${inputs[@]}"
          if [ "${#inputs[@]}" -lt 2 ] || [ "${#inputs[@]}" -gt 3 ]; then echo "::error::expected 2-3 coverage inputs, got ${#inputs[@]}"; exit 1; fi
          node scripts/coverage-merge.mjs "${soft[@]}" coverage/merged "${inputs[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: merged-coverage
          path: coverage/merged/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
